# 1 h full-device stress: 15 windows (60 MiB), new pseudo-random pattern per
# cycle (integrity still runs first)
CONFIG_SDRAM_BENCH_CPU=n
CONFIG_SDRAM_BENCH_ACCESS=n
CONFIG_SDRAM_BENCH_SUSTAINED_SEC=3600
CONFIG_SDRAM_BENCH_SUSTAINED_REPORT_SEC=30
CONFIG_SDRAM_BENCH_SUSTAINED_FULL=y
