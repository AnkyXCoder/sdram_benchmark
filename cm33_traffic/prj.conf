# CM33 SDRAM traffic generator for sdram_benchmark. No console: uart0 belongs
# to the CM85. The SDRAM controller is initialized by the CM85 image.
CONFIG_GPIO=y
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_MEMC=n
CONFIG_NETWORKING=n
CONFIG_ENTROPY_GENERATOR=n
CONFIG_INIT_STACKS=n
