# SPDX-License-Identifier: Apache-2.0

CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
# Also required for uart_renesas_ra8_sci_b.c to compile
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PRINTK=y
CONFIG_PINCTRL=y

# External SDRAM controller
CONFIG_MEMC=y
CONFIG_MEMC_RENESAS_RA_SDRAM=y

# The RA8P1 SoC defaults leave the data cache disabled
CONFIG_DCACHE=y
CONFIG_CACHE_MANAGEMENT=y

# DWT cycle counter based timing
CONFIG_TIMING_FUNCTIONS=y

# CONFIG_SPEED_OPTIMIZATIONS is not used: at -O2 GCC emits FPU register loads in
# the FSP bsp_clock_init(), which runs before the FPU is enabled (NOCP HardFault).
# The benchmark sources are built with -O2 in CMakeLists.txt instead.

CONFIG_MAIN_STACK_SIZE=4096

# Keep CM33 halted: no second bus master, and no stale CPU1 image in MRAM
# that could reset the system during the run
CONFIG_SOC_RA_ENABLE_START_SECOND_CORE=n
